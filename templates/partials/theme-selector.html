{% if themes is not defined %}{% set themes = config.extra.themes %}{% endif %}
<div class="theme-strip-row">
  <button type="button" class="strip-arrow strip-arrow-left" data-scroll="left" aria-label="Scroll themes left" hidden><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
  <div class="theme-strip" role="group" aria-label="Theme">
    {% for theme in themes %}
      <button type="button" class="theme-btn" data-theme-id="{{ theme[0] }}" data-mode="{{ theme[2] }}" data-accent="{{ theme[4] }}" aria-pressed="false" title="Switch to {{ theme[1] }}">
        <span class="theme-swatch" style="background: linear-gradient(135deg, {{ theme[3] }} 50%, {{ theme[4] }} 50%)" aria-hidden="true"></span>
        <span class="theme-btn-name">{{ theme[1] }}</span>
      </button>
    {% endfor %}
  </div>
  <button type="button" class="strip-arrow strip-arrow-right" data-scroll="right" aria-label="Scroll themes right" hidden><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
</div>
