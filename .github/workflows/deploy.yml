name: Deploy redirect stubs to GitHub Pages

# Manual-only: the old GitHub Pages site keeps serving its last good build
# until we deliberately switch it to redirect stubs (new home:
# https://undiscoveredmaterials.com). Run once at cutover via:
#   gh workflow run deploy.yml
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Upload redirect stubs as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: redirect
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
