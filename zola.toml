base_url = "https://undiscoveredmaterials.com"
title = "Pratik’s notes"
description = "Notes on software, systems, and building things."
default_language = "en"
output_dir = "dist"
compile_sass = false
minify_html = false
generate_feeds = true
feed_filenames = ["rss.xml"]
generate_sitemap = true
generate_robots_txt = false
taxonomies = [{ name = "tags", render = false, feed = false }]

[markdown]
bottom_footnotes = false
insert_anchor_links = "none"

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"
error_on_missing_language = true

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[link_checker]
internal_level = "error"
external_level = "warn"

